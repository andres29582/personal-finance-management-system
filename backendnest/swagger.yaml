  responses:
    OkObject:
      description: Operacao bem-sucedida.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SuccessObject'
    OkArray:
      description: Lista retornada com sucesso.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SuccessArray'
    OkMessage:
      description: Mensagem retornada com sucesso.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SuccessMessage'
    EmptyEnvelope:
      description: Operacao concluida; `data` pode ser null.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SuccessAny'
    BadRequest:
      description: Payload, parametro ou query invalido.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Token ausente, invalido, expirado ou sessao invalida.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Usuario sem permissao para a operacao.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Recurso inexistente ou nao acessivel ao usuario.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Conflito de regra ou recurso duplicado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: Servico externo indisponivel ou resposta incompativel.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
paths:
  /:
    get:
      tags:
      - App
      summary: Mensagem raiz da API
      responses:
        '200':
          description: Operacao realizada com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessString'
      operationId: getRootMessage
  /health:
    get:
      tags:
      - App
      summary: Health check do backend
      responses:
        '200':
          description: Operacao realizada com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponseSuccess'
      operationId: getHealth
  /cep/{cep}:
    get:
      tags:
      - CEP
      summary: Consulta publica de CEP via ViaCEP
      parameters:
      - name: cep
        in: path
        required: true
        schema:
          type: string
          pattern: ^\d{8}$
      responses:
        '200':
          description: Operacao realizada com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CepResponseSuccess'
        '422':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/ServiceUnavailable'
      operationId: lookupCep
  /auth/register:
    post:
      tags:
      - Auth
      summary: Registrar usuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Operacao realizada com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/BadRequest'
      operationId: register
  /auth/login:
    post:
      tags:
      - Auth
      summary: Login com email e senha
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Operacao realizada com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
      operationId: login
  /auth/forgot-password:
    post:
      tags:
      - Auth
      summary: Solicitar recuperacao de senha
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '200':
          $ref: '#/components/responses/OkMessage'
        '400':
          $ref: '#/components/responses/BadRequest'
      operationId: forgotPassword
  /auth/reset-password-token:
    post:
      tags:
      - Auth
      summary: Redefinir senha com token publico
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordTokenRequest'
      responses:
        '200':
          $ref: '#/components/responses/OkMessage'
        '400':
          $ref: '#/components/responses/BadRequest'
      operationId: resetPasswordWithToken
  /auth/refresh:
    post:
      tags:
      - Auth
      summary: Rotacionar refresh token e emitir novo access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Operacao realizada com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
      operationId: refreshToken
  /auth/logout:
    post:
      tags:
      - Auth
      summary: Encerrar sessao atual
      security:
      - BearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/OkMessage'
        '401':
          $ref: '#/components/responses/Unauthorized'
      operationId: logout
  /auth/reset-password:
    post:
      tags:
      - Auth
      summary: Alterar senha do usuario autenticado
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '201':
          $ref: '#/components/responses/OkMessage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
      operationId: resetPassword
  /users/me:
    get:
      tags:
      - Users
      summary: Obter perfil do usuario autenticado
