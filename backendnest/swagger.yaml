openapi: 3.0.0
info:
  title: API de Gestao Financeira Pessoal
  version: 1.0.0
  description: 'Contrato oficial da API REST do projeto `meu-sistema-financeiro`.


    Este arquivo (`backendnest/swagger.yaml`) e a fonte oficial de contrato dos endpoints HTTP do backend NestJS. Documentos
    em `docs/validacao/` sao relatorios de auditoria e nao substituem este contrato OpenAPI.


    Nao ha prefixo global configurado no backend; todas as rotas partem da raiz do servidor.


    Rotas publicas: `GET /`, `GET /health`, `GET /cep/{cep}`, `POST /auth/register`, `POST /auth/login`, `POST /auth/forgot-password`,
    `POST /auth/reset-password-token` e `POST /auth/refresh`.


    Rotas protegidas usam `Authorization: Bearer <access_token>` e validacao de sessao ativa.


    Todas as respostas bem-sucedidas sao envelopadas como `{ success, data, timestamp, requestId }`. Erros de dominio usam
    `{ success:false, error, timestamp, requestId }`; erros NestJS/Passport/ValidationPipe podem usar `{ statusCode, message,
    error }`.

    '
servers:
- url: http://localhost:3000
  description: Servidor local de desenvolvimento
tags:
- name: App
- name: Auth
- name: Users
- name: CEP
- name: Contas
- name: Categorias
- name: Transacoes
- name: Transferencias
- name: Dividas
- name: PagosDivida
- name: Metas
- name: Alertas
- name: Orcamentos
- name: Relatorios
- name: Dashboard
- name: Previsoes
- name: AuditLogs
- name: Planejamentos
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DividaIdParam:
      name: dividaId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PlanejamentoIdParam:
      name: planejamentoId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    GastoIdParam:
      name: gastoId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AcertoIdParam:
      name: acertoId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    SuccessAny:
      type: object
      required:
      - success
      - data
      - timestamp
      - requestId
      properties:
        success:
          type: boolean
          enum:
          - true
        data:
          nullable: true
          description: Payload retornado pelo controller.
        timestamp:
          type: string
          format: date-time
        requestId:
          type: string
    SuccessObject:
      allOf:
      - $ref: '#/components/schemas/SuccessAny'
      - type: object
        properties:
          data:
            type: object
            additionalProperties: true
    SuccessArray:
      allOf:
      - $ref: '#/components/schemas/SuccessAny'
      - type: object
        properties:
          data:
            type: array
            items:
              type: object
              additionalProperties: true
    SuccessString:
      allOf:
      - $ref: '#/components/schemas/SuccessAny'
      - type: object
        properties:
          data:
            type: string
    SuccessMessage:
      allOf:
      - $ref: '#/components/schemas/SuccessAny'
      - type: object
        properties:
          data:
            type: object
            properties:
              message:
                type: string
              resetToken:
                type: string
                description: Retornado apenas quando AUTH_RETURN_RESET_TOKEN=true.
    RegisterSuccess:
      allOf:
      - $ref: '#/components/schemas/SuccessAny'
      - type: object
        properties:
          data:
            type: object
            properties:
              usuario:
                $ref: '#/components/schemas/PublicUser'
    LoginSuccess:
      allOf:
      - $ref: '#/components/schemas/SuccessAny'
      - type: object
        properties:
          data:
            type: object
            required:
            - access_token
            - refresh_token
            - usuario
            properties:
              access_token:
                type: string
              refresh_token:
                type: string
              usuario:
                $ref: '#/components/schemas/PublicUser'
    RefreshSuccess:
      allOf:
      - $ref: '#/components/schemas/SuccessAny'
      - type: object
        properties:
          data:
            type: object
            required:
            - access_token
            - refresh_token
            properties:
              access_token:
                type: string
              refresh_token:
                type: string
    PublicUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
        nome:
          type: string
        email:
          type: string
          format: email
        cpf:
          type: string
          nullable: true
        cep:
          type: string
          nullable: true
        endereco:
          type: string
          nullable: true
        numero:
          type: string
          nullable: true
        cidade:
          type: string
          nullable: true
        moedaPadrao:
          type: string
          nullable: true
    DomainErrorEnvelope:
      type: object
      required:
      - success
      - error
      - timestamp
      - requestId
      properties:
        success:
          type: boolean
          enum:
          - false
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
            message:
              type: string
            field:
              type: string
            details:
              type: object
              additionalProperties: true
        timestamp:
          type: string
          format: date-time
        requestId:
          type: string
    HttpErrorEnvelope:
      type: object
      required:
      - statusCode
      - message
      properties:
        statusCode:
          type: integer
        message:
          oneOf:
          - type: string
          - type: array
            items:
              type: string
        error:
          type: string
    ErrorResponse:
      oneOf:
      - $ref: '#/components/schemas/DomainErrorEnvelope'
      - $ref: '#/components/schemas/HttpErrorEnvelope'
    RegisterRequest:
      type: object
      required:
      - nome
      - email
      - cpf
      - cep
      - endereco
      - numero
      - cidade
      - senha
      - aceitoPoliticaPrivacidade
      properties:
        nome:
          type: string
          maxLength: 150
        email:
          type: string
          format: email
        cpf:
          type: string
          pattern: ^\d{11}$
        cep:
          type: string
          pattern: ^\d{8}$
        endereco:
          type: string
          maxLength: 150
        numero:
          type: string
          maxLength: 20
        cidade:
          type: string
          maxLength: 100
        senha:
          type: string
          minLength: 6
        aceitoPoliticaPrivacidade:
          type: boolean
          enum:
          - true
    LoginRequest:
      type: object
      required:
      - email
      - senha
      properties:
        email:
          type: string
          format: email
        senha:
          type: string
    ForgotPasswordRequest:
      type: object
      required:
      - email
      properties:
        email:
          type: string
          format: email
    ResetPasswordTokenRequest:
      type: object
      required:
      - token
      - novaSenha
      properties:
        token:
          type: string
        novaSenha:
          type: string
          minLength: 6
    RefreshTokenRequest:
      type: object
      required:
      - refreshToken
      properties:
        refreshToken:
          type: string
    ResetPasswordRequest:
      type: object
      required:
      - novaSenha
      properties:
        novaSenha:
          type: string
          minLength: 6
    UpdateUserProfileRequest:
      type: object
      properties:
        nome:
          type: string
          maxLength: 150
        email:
          type: string
          format: email
        cpf:
          type: string
          pattern: ^\d{11}$
        cep:
          type: string
          pattern: ^\d{8}$
        endereco:
          type: string
          maxLength: 150
        numero:
          type: string
          maxLength: 20
        cidade:
          type: string
          maxLength: 100
    CreateContaRequest:
      type: object
      required:
      - nome
      - tipo
      - saldoInicial
      properties:
        nome:
          type: string
        tipo:
          type: string
          enum:
          - dinheiro
          - banco
          - poupanca
          - cartao_credito
        saldoInicial:
          type: number
        limiteCredito:
          type: number
        dataCorte:
          type: integer
          minimum: 1
          maximum: 31
        dataPagamento:
          type: integer
          minimum: 1
          maximum: 31
    UpdateContaRequest:
      type: object
