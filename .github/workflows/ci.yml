# GitHub Actions usa chaves e integracoes em ingles por padrao.
# Por isso, os identificadores tecnicos abaixo seguem esse idioma,
# enquanto a explicacao da logica fica documentada em portugues.

name: CI

on:
  # Validamos em push e pull request porque estes sao os pontos
  # em que o codigo normalmente tenta entrar no fluxo principal.
  push:
  pull_request:

# Cancelar execucoes antigas evita gastar tempo com pipelines
# de commits que ja foram substituidos por versoes mais novas.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# O workflow so precisa ler o conteudo do repositorio.
# Declarar a permissao minima reduz superficie desnecessaria.
permissions:
  contents: read

jobs:
  access-browser:
    name: Access web journeys
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      CI: true
      E2E_DB_HOST: localhost
      E2E_DB_PORT: 5432
      E2E_DB_USERNAME: finance_e2e_access_ci_owner
      E2E_DB_PASSWORD: disposable-access-ci-only
      E2E_DB_NAME: finance_e2e_access_ci
      E2E_DB_RESET_CONFIRM: finance_e2e_access_ci
      EXPO_NO_DOTENV: 1
      EXPO_NO_TELEMETRY: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: |
            backendnest/package-lock.json
            frontend/package-lock.json
      - name: Install locked application dependencies
        timeout-minutes: 6
        run: |
          npm ci --prefix backendnest --no-audit --no-fund
          npm ci --prefix frontend --no-audit --no-fund
      - name: Install headless Chromium
        timeout-minutes: 4
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Record Node, npm and PostgreSQL client versions
        run: |
          node --version
          npm --version
          psql --version
      - name: Bootstrap the confined disposable database
        env:
          PGPASSWORD: postgres
        run: |
          psql -X -h localhost -p 5432 -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          SELECT version();
          CREATE ROLE finance_e2e_access_ci_owner LOGIN PASSWORD 'disposable-access-ci-only' NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;
          CREATE DATABASE finance_e2e_access_ci OWNER finance_e2e_access_ci_owner;
          COMMENT ON DATABASE finance_e2e_access_ci IS 'finance-e2e-disposable';
          REVOKE CONNECT ON DATABASE postgres FROM PUBLIC;
          REVOKE CONNECT ON DATABASE template1 FROM PUBLIC;
          REVOKE ALL ON DATABASE finance_e2e_access_ci FROM PUBLIC;
          GRANT CONNECT, CREATE, TEMPORARY ON DATABASE finance_e2e_access_ci TO finance_e2e_access_ci_owner;
          SQL
      - name: Verify access runner confinement checks
        run: node --test backendnest/test/access-browser-runner.spec.cjs
      - name: Build and verify real access journeys
        working-directory: backendnest
        run: npm run test:access-browser

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    # CI=true ajuda ferramentas do ecossistema React/Expo a
    # assumirem comportamento nao interativo dentro da pipeline.
    env:
      CI: true
      EXPO_NO_DOTENV: 1
      EXPO_NO_TELEMETRY: 1

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias do frontend
        # npm ci foi escolhido porque reproduz exatamente o lockfile,
        # deixando a pipeline previsivel e mais confiavel.
        timeout-minutes: 5
        run: npm ci --no-audit --no-fund

      - name: Verify frontend lint contract
        run: npm run lint:contract

      - name: Rodar lint do frontend
        # Aqui usamos o script atual do projeto para manter a CI
        # alinhada ao fluxo que ja funciona localmente na equipe.
        # Os warnings existentes serao tratados na proxima etapa de limpeza.
        run: npm run lint

      - name: Validar tipos do frontend
        run: npm run typecheck

      - name: Executar testes do frontend
        # runInBand deixa a execucao mais previsivel no ambiente compartilhado da CI.
        run: npm test -- --runInBand

      - name: Gerar export web do frontend
        # O export web valida que o app consegue produzir o bundle estatico.
        run: npm run export:web

  backend:
    name: Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      CI: true

    defaults:
      run:
        working-directory: backendnest

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: backendnest/package-lock.json

      - name: Install both locked packages for full cross-package harness types
        timeout-minutes: 6
        run: |
          npm ci --no-audit --no-fund
          npm ci --prefix ../frontend --no-audit --no-fund

      - name: Verify maintained lint scope and blocking rules
        run: npm run lint:contract

      - name: Check all maintained sources, tests and Node configuration
        run: npm run lint

      - name: Validate full types and build types
        run: |
          npm run typecheck
          npm run typecheck:build

      - name: Run portable offline harnesses
        timeout-minutes: 4
        run: npm run test:harness:portable

      - name: Executar testes unitarios do backend
        # O modo runInBand reduz variacoes de concorrencia e torna
        # o diagnostico mais estavel para uma primeira pipeline.
        run: npm test -- --runInBand

      - name: Gerar build do backend
        # O build fecha o ciclo basico de confianca: lint, tipos,
        # testes e capacidade real de compilar a aplicacao.
        run: npm run build

  backend-e2e:
    name: Backend E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      CI: true
      NODE_ENV: test
      E2E_DB_HOST: localhost
      E2E_DB_PORT: 5432
      E2E_DB_USERNAME: finance_e2e_ci_owner
      E2E_DB_PASSWORD: disposable-ci-only
      E2E_DB_NAME: finance_e2e_ci
      E2E_DB_RESET_CONFIRM: finance_e2e_ci

    defaults:
      run:
        working-directory: backendnest

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: backendnest/package-lock.json

      - name: Instalar dependencias do backend
        timeout-minutes: 5
        run: npm ci --no-audit --no-fund

      - name: Bootstrap confined disposable E2E database
        env:
          PGPASSWORD: postgres
        run: |
          psql -X -h localhost -p 5432 -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          SELECT version();
          CREATE ROLE finance_e2e_ci_owner LOGIN PASSWORD 'disposable-ci-only' NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;
          ALTER ROLE finance_e2e_ci_owner SET timezone='UTC';
          CREATE DATABASE finance_e2e_ci OWNER finance_e2e_ci_owner;
          COMMENT ON DATABASE finance_e2e_ci IS 'finance-e2e-disposable';
          REVOKE CONNECT ON DATABASE postgres FROM PUBLIC;
          REVOKE CONNECT ON DATABASE template1 FROM PUBLIC;
          REVOKE ALL ON DATABASE finance_e2e_ci FROM PUBLIC;
          GRANT CONNECT, CREATE, TEMPORARY ON DATABASE finance_e2e_ci TO finance_e2e_ci_owner;
          SQL

      - name: Executar testes E2E do backend
        # O helper verifica owner/marker/confirmacao antes de recriar public.
        run: npm run test:e2e

  windows-ownership:
    name: Windows process ownership
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
      - name: Install locked backend dependencies
        timeout-minutes: 5
        run: npm ci --prefix backendnest --no-audit --no-fund
      - name: Verify actual Windows Job cancellation and orphan containment
        timeout-minutes: 3
        working-directory: backendnest
        run: npm run test:harness:windows

  ml:
    name: Machine Learning Linux lock
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ml-finance-tcc
    env:
      MPLBACKEND: Agg
      PYTHONDONTWRITEBYTECODE: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
          cache: pip
          cache-dependency-path: ml-finance-tcc/requirements-ci.lock
      - name: Record Linux and Python versions
        run: |
          uname -a
          python --version
          python -m pip --version
      - name: First clean hash-checked installation
        timeout-minutes: 6
        run: |
          python -m venv .venv-ci-first
          .venv-ci-first/bin/python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: --timeout 30 --retries 2 -r requirements-ci.lock
          .venv-ci-first/bin/python -m pip check
      - name: Test first clean environment
        timeout-minutes: 3
        run: .venv-ci-first/bin/python -m pytest
      - name: Second independent hash-checked installation
        timeout-minutes: 6
        run: |
          python -m venv .venv-ci-second
          .venv-ci-second/bin/python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: --timeout 30 --retries 2 -r requirements-ci.lock
          .venv-ci-second/bin/python -m pip check
      - name: Test second clean environment
        timeout-minutes: 3
        run: .venv-ci-second/bin/python -m pytest
      - name: Confirm dependency inputs stayed unchanged
        run: git diff --exit-code -- requirements.txt requirements-ci.lock
