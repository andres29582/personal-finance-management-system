# GitHub Actions usa chaves e integracoes em ingles por padrao.
# Por isso, os identificadores tecnicos abaixo seguem esse idioma,
# enquanto a explicacao da logica fica documentada em portugues.

name: CI

on:
  # Validamos em push e pull request porque estes sao os pontos
  # em que o codigo normalmente tenta entrar no fluxo principal.
  push:
  pull_request:

# Cancelar execucoes antigas evita gastar tempo com pipelines
# de commits que ja foram substituidos por versoes mais novas.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# O workflow so precisa ler o conteudo do repositorio.
# Declarar a permissao minima reduz superficie desnecessaria.
permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    # CI=true ajuda ferramentas do ecossistema React/Expo a
    # assumirem comportamento nao interativo dentro da pipeline.
    env:
      CI: true

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias do frontend
        # npm ci foi escolhido porque reproduz exatamente o lockfile,
        # deixando a pipeline previsivel e mais confiavel.
        run: npm ci

      - name: Rodar lint do frontend
        # Aqui usamos o script atual do projeto para manter a CI
        # alinhada ao fluxo que ja funciona localmente na equipe.
        # Os warnings existentes serao tratados na proxima etapa de limpeza.
        run: npm run lint

      - name: Validar tipos do frontend
        run: npm run typecheck

      - name: Executar testes do frontend
        # runInBand deixa a execucao mais previsivel no ambiente compartilhado da CI.
        run: npm test -- --runInBand

      - name: Gerar export web do frontend
        # O export web valida que o app consegue produzir o bundle estatico.
        run: npm run export:web

  backend:
    name: Backend
    runs-on: ubuntu-latest

    env:
      CI: true

    defaults:
      run:
        working-directory: backendnest

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backendnest/package-lock.json

      - name: Instalar dependencias do backend
        run: npm ci

      - name: Rodar lint do backend sem autofix
        # O script npm atual do backend usa --fix, o que e util localmente,
        # mas inadequado em CI porque uma pipeline nao deve reescrever codigo.
        # Por isso, executamos o ESLint em modo somente validacao.
        # O lint de CI fica no codigo de runtime; os specs sao validados
        # pelo passo de testes para evitar falhas por mocks tipados como any.
        run: >
          npx eslint "src/**/*.ts"
          --ignore-pattern "**/*.spec.ts"
          --rule "@typescript-eslint/no-unsafe-assignment: warn"
          --rule "@typescript-eslint/no-unsafe-call: warn"
          --rule "@typescript-eslint/no-unsafe-member-access: warn"

      - name: Validar tipos do backend
        # Usamos o mesmo escopo do build do Nest, que exclui specs/e2e.
        # Os testes unitarios continuam executando no passo seguinte.
        run: npx tsc --noEmit -p tsconfig.build.json

      - name: Executar testes unitarios do backend
        # O modo runInBand reduz variacoes de concorrencia e torna
        # o diagnostico mais estavel para uma primeira pipeline.
        run: npm test -- --runInBand

      - name: Gerar build do backend
        # O build fecha o ciclo basico de confianca: lint, tipos,
        # testes e capacidade real de compilar a aplicacao.
        run: npm run build

  backend-e2e:
    name: Backend E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      CI: true
      NODE_ENV: test
      E2E_DB_HOST: localhost
      E2E_DB_PORT: 5432
      E2E_DB_USERNAME: postgres
      E2E_DB_PASSWORD: postgres
      E2E_DB_NAME: gestao_financeira_test
      E2E_DB_ADMIN_DATABASE: postgres

    defaults:
      run:
        working-directory: backendnest

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backendnest/package-lock.json

      - name: Instalar dependencias do backend
        run: npm ci

      - name: Executar testes E2E do backend
        # O helper E2E cria o banco de teste, recria o schema public
        # e aplica as migrations SQL versionadas antes das suites.
        run: npm run test:e2e

  ml:
    name: Machine Learning
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ml-finance-tcc

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ml-finance-tcc/requirements.txt

      - name: Instalar dependencias do ML
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Executar testes do ML
        run: python -m pytest
